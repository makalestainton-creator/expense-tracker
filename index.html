<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link rel="stylesheet" href="styles/home-page.css" />
  </head>
  <body>
    <div class="header">
      <div class="left-header-section">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 100 100"
          width="40"
          height="40"
        >
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #0f766e; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #14b8a6; stop-opacity: 1" />
            </linearGradient>
            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #fbbf24; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #f59e0b; stop-opacity: 1" />
            </linearGradient>
            <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #60a5fa; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #3b82f6; stop-opacity: 1" />
            </linearGradient>
            <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #a78bfa; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #8b5cf6; stop-opacity: 1" />
            </linearGradient>
          </defs>

          <!-- Pie slice 1 (30% - teal/cyan) -->
          <path
            d="M 50 50 L 50 5 A 45 45 0 0 1 89.27 39.27 Z"
            fill="url(#grad1)"
          />

          <!-- Pie slice 2 (25% - yellow/amber) -->
          <path
            d="M 50 50 L 89.27 39.27 A 45 45 0 0 1 89.27 60.73 Z"
            fill="url(#grad2)"
          />

          <!-- Pie slice 3 (25% - blue) -->
          <path
            d="M 50 50 L 89.27 60.73 A 45 45 0 0 1 29.29 89.27 Z"
            fill="url(#grad3)"
          />

          <!-- Pie slice 4 (20% - purple) -->
          <path
            d="M 50 50 L 29.29 89.27 A 45 45 0 0 1 50 5 Z"
            fill="url(#grad4)"
          />

          <!-- Dividing lines -->
          <line x1="50" y1="50" x2="50" y2="5" stroke="white" stroke-width="2" />
          <line
            x1="50"
            y1="50"
            x2="89.27"
            y2="39.27"
            stroke="white"
            stroke-width="2"
          />
          <line
            x1="50"
            y1="50"
            x2="89.27"
            y2="60.73"
            stroke="white"
            stroke-width="2"
          />
          <line
            x1="50"
            y1="50"
            x2="29.29"
            y2="89.27"
            stroke="white"
            stroke-width="2"
          />
        </svg>
        <div class="dashboard-text">
          <p class="dashboard-title">Expense dashboard</p>
          <p class="dashboard-illustration">Track, review and stay in control</p>
        </div>
      </div>
      <div class="right-header-section">
        <a href="expenses.html" class="expenses-link">
          <img src="icons/tracking-room.png" class="expenses-icon" />
          <span>Expenses</span>
        </a>
        <button class="change-theme-button js-change-theme-button">
          <svg
            width="46"
            height="58"
            viewBox="0 -10 96 58"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <style>
                .toggle-button {
                  cursor: pointer;
                  transition: all 0.3s ease;
                }
                .toggle-button:hover {
                  opacity: 0.8;
                }
                .sun-moon {
                  transition: all 0.4s ease;
                  transform-origin: center;
                }
                .light-mode .sun-moon {
                  transform: rotate(0deg);
                }
                .dark-mode .sun-moon {
                  transform: rotate(180deg);
                }
                .sun-rays {
                  opacity: 1;
                  transition: opacity 0.3s ease;
                }
                .dark-mode .sun-rays {
                  opacity: 0;
                }
                .moon-crater {
                  opacity: 0;
                  transition: opacity 0.3s ease;
                }
                .dark-mode .moon-crater {
                  opacity: 1;
                }
              </style>
            </defs>

            <g
              class="toggle-button light-mode"
              onclick="
                this.classList.toggle('light-mode');
                this.classList.toggle('dark-mode');
              "
            >
              <!-- Background circle -->
              <circle
                cx="24"
                cy="24"
                r="22"
                fill="#f0f0f0"
                stroke="#333"
                stroke-width="2"
              />

              <!-- Sun/Moon body -->
              <g class="sun-moon">
                <circle cx="24" cy="24" r="8" fill="#0f766e" />

                <!-- Moon craters (hidden in light mode) -->
                <g class="moon-crater">
                  <circle cx="21" cy="22" r="2" fill="#E6C200" opacity="0.5" />
                  <circle cx="26" cy="25" r="1.5" fill="#E6C200" opacity="0.5" />
                </g>

                <!-- Sun rays (visible in light mode) -->
                <g class="sun-rays">
                  <line
                    x1="24"
                    y1="8"
                    x2="24"
                    y2="4"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="24"
                    y1="44"
                    x2="24"
                    y2="40"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="8"
                    y1="24"
                    x2="4"
                    y2="24"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="44"
                    y1="24"
                    x2="40"
                    y2="24"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="12.5"
                    y1="12.5"
                    x2="9.5"
                    y2="9.5"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="38.5"
                    y1="9.5"
                    x2="35.5"
                    y2="12.5"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="9.5"
                    y1="38.5"
                    x2="12.5"
                    y2="35.5"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="35.5"
                    y1="35.5"
                    x2="38.5"
                    y2="38.5"
                    stroke="#0f766e"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </g>
              </g>
            </g>
          </svg>
        </button>
      </div>
    </div>
    <div class="wrapper">
      <div class="title">
        <h1>Track your Expenses Here</h1>
      </div>
      <div class="line-separator"></div>
      <div class="month-pill js-month-pill">

      </div>
      <div class="content-area">
        <div class="expense-details">
          <div class="expense-grid">
            <p class="label">Description:</p>
            <input
              type="text"
              class="expense-input js-expense-input js-expense-description-input"
              placeholder="Expense description"
            />
            <p class="expense-amount label">Amount:</p>
            <!-- styling div here -->
            <div class="prefix-container">
              <span class="prefix">Ksh.</span>
              <input
                type="text"
                class="expense-input js-expense-input js-expense-amount-input amount-input"
                placeholder="0.00"
              />
            </div>
            <p class="expense-cartegory label">Cartegory:</p>
            <select
              name=""
              id=""
              class="expense-input js-expense-input js-expense-cartegory-input"
            >
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
            <p class="expense-date label">Date:</p>
            <input
              type="date"
              class="expense-input js-expense-input js-expense-date-input"
            />
          </div>
          <button class="add-expense-button js-add-expense-button">Add</button>
          <div class="added-to-tracker js-added-to-tracker">
            <img src="icons/checkmark.png" class="checkmark" />
            Added
          </div>
          <div class="empty-field-warning js-empty-field-warning"></div>
        </div>
        <div class="total-expenditure js-total-expenditure"></div>
      </div>
      <p class="code-link-container">
          <a href="https://github.com/makalestainton-creator/expense-tracker" class="code-link">
          View code
          <img src="icons/github.png" class="github-icon">
        </a>
      </p>
    </div>
    <script type="module" src="scripts/homePage.js"></script>
  </body>
</html>
