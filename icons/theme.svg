<svg
  width="30"
  height="30"
  viewBox="0 0 50 50"
  xmlns="http://www.w3.org/2000/svg"
>

  <g
    class="toggle-button light-mode"
    onclick="
                this.classList.toggle('light-mode');
                this.classList.toggle('dark-mode');
              "
  >
    <!-- Background circle -->
    <circle
      cx="24"
      cy="24"
      r="22"
      fill="#f0f0f0"
      stroke="#333"
      stroke-width="2"
    />

    <!-- Sun/Moon body -->
    <g class="sun-moon">
      <circle cx="24" cy="24" r="8" fill="#0f766e" />

      <!-- Moon craters (hidden in light mode) -->
      <g class="moon-crater">
        <circle cx="21" cy="22" r="2" fill="#E6C200" opacity="0.5" />
        <circle
          cx="26"
          cy="25"
          r="1.5"
          fill="#E6C200"
          opacity="0.5"
        />
      </g>

      <!-- Sun rays (visible in light mode) -->
      <g class="sun-rays">
        <line
          x1="24"
          y1="8"
          x2="24"
          y2="4"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="24"
          y1="44"
          x2="24"
          y2="40"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="8"
          y1="24"
          x2="4"
          y2="24"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="44"
          y1="24"
          x2="40"
          y2="24"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="12.5"
          y1="12.5"
          x2="9.5"
          y2="9.5"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="38.5"
          y1="9.5"
          x2="35.5"
          y2="12.5"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="9.5"
          y1="38.5"
          x2="12.5"
          y2="35.5"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="35.5"
          y1="35.5"
          x2="38.5"
          y2="38.5"
          stroke="#0f766e"
          stroke-width="2"
          stroke-linecap="round"
        />
      </g>
    </g>
  </g>
</svg>