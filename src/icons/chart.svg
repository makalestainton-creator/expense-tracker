<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="40"
  height="40"
>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0f766e; stop-opacity: 1" />
      <stop
        offset="100%"
        style="stop-color: #14b8a6; stop-opacity: 1"
      />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #fbbf24; stop-opacity: 1" />
      <stop
        offset="100%"
        style="stop-color: #f59e0b; stop-opacity: 1"
      />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #60a5fa; stop-opacity: 1" />
      <stop
        offset="100%"
        style="stop-color: #3b82f6; stop-opacity: 1"
      />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #a78bfa; stop-opacity: 1" />
      <stop
        offset="100%"
        style="stop-color: #8b5cf6; stop-opacity: 1"
      />
    </linearGradient>
  </defs>

  <!-- Pie slice 1 (30% - teal/cyan) -->
  <path
    d="M 50 50 L 50 5 A 45 45 0 0 1 89.27 39.27 Z"
    fill="url(#grad1)"
  />

  <!-- Pie slice 2 (25% - yellow/amber) -->
  <path
    d="M 50 50 L 89.27 39.27 A 45 45 0 0 1 89.27 60.73 Z"
    fill="url(#grad2)"
  />

  <!-- Pie slice 3 (25% - blue) -->
  <path
    d="M 50 50 L 89.27 60.73 A 45 45 0 0 1 29.29 89.27 Z"
    fill="url(#grad3)"
  />

  <!-- Pie slice 4 (20% - purple) -->
  <path
    d="M 50 50 L 29.29 89.27 A 45 45 0 0 1 50 5 Z"
    fill="url(#grad4)"
  />

  <!-- Dividing lines -->
  <line
    x1="50"
    y1="50"
    x2="50"
    y2="5"
    stroke="white"
    stroke-width="2"
  />
  <line
    x1="50"
    y1="50"
    x2="89.27"
    y2="39.27"
    stroke="white"
    stroke-width="2"
  />
  <line
    x1="50"
    y1="50"
    x2="89.27"
    y2="60.73"
    stroke="white"
    stroke-width="2"
  />
  <line
    x1="50"
    y1="50"
    x2="29.29"
    y2="89.27"
    stroke="white"
    stroke-width="2"
  />
</svg>