<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicons/apple-touch-icon.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body>
    <div class="header">
      <div class="left-header-section">
        <img src="icons/chart.svg" alt="chart icon" class="chart-icon" />
        <div class="dashboard-text">
          <p class="dashboard-title">Trecker</p>
          <p class="dashboard-illustration">
            Track, review and stay in control
          </p>
        </div>
      </div>
      <div class="right-header-section">
        <div class="search">
          <img src="icons/search.svg" class="search-icon" />
          <input type="text" name="search" id="search" placeholder="Search" />
        </div>
        <button class="mode home-btn active-mode">Home</button>
        <button class="mode expenses-btn">Expenses</button>
        <button class="change-theme-button js-change-theme-button">
          <img src="icons/theme.svg" />
        </button>
      </div>
    </div>
    <div class="wrapper">
      <section class="home-screen js-home-screen">
        <h1>Track your Expenses Here</h1>
        <div class="month-pill-container">
          <div class="month-pill js-month-pill"></div>
        </div>
        <div class="content-area">
          <div class="left-panel">
            <div class="expense-details">
              <div class="expense-grid">
                <label for="description">Description:</label>
                <div>
                  <input
                    type="text"
                    class="expense-input js-expense-input js-expense-description-input"
                    placeholder="Expense description"
                    id="description"
                  />
                  <span class="error description-error">
                    <img src="icons/alert-circle.svg" />
                    Description is required
                  </span>
                </div>
                <label for="amount">Amount:</label>
                <div>
                  <div class="prefix-container">
                    <span class="prefix">Ksh.</span>
                    <input
                      type="text"
                      class="expense-input js-expense-input js-expense-amount-input amount-input"
                      placeholder="0.00"
                      id="amount"
                    />
                  </div>
                  <span class="error amount-error">
                    <img src="icons/alert-circle.svg" />
                    Enter a valid amount
                  </span>
                </div>
                <label for="category">Category:</label>
                <div>
                  <select
                    id="category-select"
                    class="expense-input js-expense-category-input"
                  >
                    <button>
                      <selectedcontent></selectedcontent>
                    </button>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <label for="date">Date:</label>
                <div>
                  <input
                    type="date"
                    class="expense-input js-expense-input js-expense-date-input"
                    id="date"
                  />
                  <span class="error date-error">
                    <img src="icons/alert-circle.svg" />
                    Please choose a date
                  </span>
                </div>
              </div>
              <button class="add-expense-button js-add-expense-button">
                Add Expense
              </button>
              <div class="added-to-tracker js-added-to-tracker"></div>
            </div>

            <div class="recents-container js-recents-container">
              <h4>Recent expenses</h4>
            </div>
          </div>

          <div class="right-panel">
            <div class="total-expenditure">
              <h2>Totals</h2>
              <div class="period-total">
                <p class="period">Today (<span class="today"></span>):</p>
                <p class="cost">Ksh.<span class="todays-total"></span></p>
                <p class="period">
                  This month (<span class="current-month"></span>):
                </p>
                <p class="cost">
                  Ksh.
                  <span class="current-month-total"></span>
                </p>
              </div>
            </div>
            <div class="chart-container js-chart-container">
              <canvas id="doughnutCanvas"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="expense-screen js-expense-screen">
        <div class="edit-alert js-edit-alert"></div>
        <h2 class="entries-title">
          Your Expenses (<span class="expense-quantity js-expense-quantity">
          </span
          >)
        </h2>

        <div class="filter-pills-container">
          <div class="category-pills-container">
            <button
              class="category-left-chevron chevron"
              aria-label="Scroll categories left"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15.75 19.5L8.25 12L15.75 4.5"
                  stroke="#0f766e"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="category-pills">
              <button
                class="pill js-category-pill food-pill"
                data-category="Food"
              >
                Food
              </button>
              <button
                class="pill js-category-pill transport-pill"
                data-category="Transport"
              >
                Transport
              </button>
              <button
                class="pill js-category-pill entertainment-pill"
                data-category="Entertainment"
              >
                Entertainment
              </button>
              <button
                class="pill js-category-pill shopping-pill"
                data-category="Shopping"
              >
                Shopping
              </button>
              <button
                class="pill js-category-pill bills-pill"
                data-category="Bills"
              >
                Bills
              </button>
              <button
                class="pill js-category-pill health-pill"
                data-category="Health"
              >
                Health
              </button>
              <button
                class="pill js-category-pill other-pill"
                data-category="Other"
              >
                Other
              </button>
            </div>
            <button class="category-right-chevron chevron">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M8.25 4.5L15.75 12L8.25 19.5"
                  stroke="#0f766e"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <div class="pill-divider"></div>

          <div class="date-pills-container">
            <button class="date-left-chevron chevron">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15.75 19.5L8.25 12L15.75 4.5"
                  stroke="#0f766e"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="date-pills">
              <button
                class="pill js-date-pill today-pill"
                data-date-range="today"
              >
                Today
              </button>
              <button
                class="pill js-date-pill this-week-pill"
                data-date-range="week"
              >
                This week
              </button>
              <button
                class="pill js-date-pill last-week-pill"
                data-date-range="last-week"
              >
                Last week
              </button>
              <button
                class="pill js-date-pill this-month-pill"
                data-date-range="month"
              >
                This month
              </button>
              <select
                id="sort-select"
                class="sort-dropdown-pills"
                style="width: auto; padding: 0.3rem 1rem"
              >
                <option value="none">-- No sort --</option>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="highest">Highest amount</option>
                <option value="lowest">Lowest amount</option>
                <option value="alpha-asc">Category A → Z</option>
                <option value="alpha-desc">Category Z → A</option>
              </select>
            </div>
            <button class="date-right-chevron chevron">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M8.25 4.5L15.75 12L8.25 19.5"
                  stroke="#0f766e"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="entries-grid js-entries-grid"></div>
        
        <p class="no-expense-alert">No expenses yet. Start tracking by adding your first expense!</p>

        <div class="confirmation-dialogue js-confirmation-dialogue"></div>
        <div class="edit-dialogue js-edit-dialogue"></div>
        <div class="overlay js-overlay"></div>
        <div class="clear-all-button-container js-clear-all-button-container">
          <button class="clear-all-button js-clear-all-button">
            Clear all
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
