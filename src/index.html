<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="./favicons/site.webmanifest" />
  </head>
  <body>
    <div class="header">
      <div class="left-header-section">
        <img src="icons/chart.svg" alt="chart icon" class="chart-icon" />
        <div class="dashboard-text">
          <p class="dashboard-title">Dashboard</p>
          <p class="dashboard-illustration">
            Track, review and stay in control
          </p>
        </div>
      </div>
      <div class="right-header-section">
        <div class="search">
          <img src="icons/search.svg" class="search-icon" />
          <input type="text" name="search" id="search" placeholder="Search" />
        </div>
        <button class="mode home-btn active-mode">Home</button>
        <button class="mode expenses-btn">Expenses</button>
        <button class="change-theme-button js-change-theme-button">
          <img src="icons/theme.svg" />
        </button>
      </div>
    </div>
    <div class="menu-container">
      <div class="menu">
        <button class="close-menu-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24" width="24" fill="#6b7280">
            <path
              d="M20 6.91L17.09 4L12 9.09L6.91 4L4 6.91L9.09 12L4 17.09L6.91 20L12 14.91L17.09 20L20 17.09L14.91 12L20 6.91Z"
            />
          </svg>
        </button>
        <div class="filter">
          <p>Filter by:</p>
          <ul>
            <li>
              <details>
                <summary>
                  Category
                  <span><img src="icons/chevron.svg" class="chevron" /></span>
                </summary>

                <ul>
                  <li>
                    <input
                      type="checkbox"
                      name="food-filter"
                      id="food-filter"
                    />
                    <label for="food-filter">Food</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="transport-filter"
                      id="transport-filter"
                    />
                    <label for="transport-filter">Transport</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="entertainment-filter"
                      id="entertainment-filter"
                    />
                    <label for="entertainment-filter">Entertainment</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="shopping-filter"
                      id="shopping-filter"
                    />
                    <label for="shopping-filter">Shopping</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="bills-filter"
                      id="bills-filter"
                    />
                    <label for="bills-filter">Bills</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="health-filter"
                      id="health-filter"
                    />
                    <label for="health-filter">Health</label>
                  </li>
                  <li>
                    <input
                      type="checkbox"
                      name="other-filter"
                      id="other-filter"
                    />
                    <label for="other-filter">Other</label>
                  </li>
                </ul>
              </details>
            </li>
            <li>
              <details>
                <summary>
                  Period added
                  <span><img src="icons/chevron.svg" class="chevron" /></span>
                </summary>

                <ul>
                  <li>
                    <input type="radio" name="period-added" id="today-filter" />
                    <label for="today-filter">Today</label>
                  </li>
                  <li>
                    <input
                      type="radio"
                      name="period-added"
                      id="this-week-filter"
                    />
                    <label for="this-week-filter">This week</label>
                  </li>
                  <li>
                    <input
                      type="radio"
                      name="period-added"
                      id="last-week-filter"
                    />
                    <label for="last-week-filter">Last week</label>
                  </li>
                  <li>
                    <input
                      type="radio"
                      name="period-added"
                      id="this-month-filter"
                    />
                    <label for="this-month-filter">This month</label>
                  </li>
                </ul>
              </details>
            </li>
            <li>
              <details class="amount-range">
                <summary>
                  Amount range
                  <span><img src="icons/chevron.svg" class="chevron" /></span>
                </summary>

                <ul>
                  <li>
                    <label for="from">From:</label>
                    <input type="number" name="from" id="from" />
                  </li>
                  <li>
                    <label for="to">To:</label>
                    <input type="number" name="to" id="to" />
                  </li>
                </ul>
              </details>
            </li>
          </ul>
        </div>
        <div class="sort">
          <p>Sort:</p>
          <ul>
            <li>
              <select name="period-sort" id="period-sort">
                <option value="Newest first">Newest first</option>
                <option value="Oldest first">Oldest first</option>
              </select>
            </li>
            <li>
              <select name="spending-sort" id="spending-sort">
                <option value="High spend">High spend</option>
                <option value="Low spend">Low spend</option>
              </select>
            </li>
            <li>
              <details>
                <summary>
                  Category(alphabetical)
                  <span><img src="icons/chevron.svg" class="chevron" /></span>
                </summary>

                <ul>
                  <li>
                    <input type="radio" name="alpha-sort" id="ascending" />
                    <label for="ascending"> Ascending </label>
                  </li>
                  <li>
                    <input type="radio" name="alpha-sort" id="descending" />
                    <label for="descending"> Descending </label>
                  </li>
                </ul>
              </details>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <button class="menu-open">
      <img src="icons/hamburger.svg" alt="" />
    </button>
    <div class="wrapper">
      <section class="home-screen js-home-screen">
        <h1>Track your Expenses Here</h1>
        <div class="month-pill-container">
          <div class="month-pill js-month-pill"></div>
        </div>
        <div class="content-area">
          <div class="left-panel">
            <div class="expense-details">
              <div class="expense-grid">
                <label for="description">Description:</label>
                <input
                  type="text"
                  class="expense-input js-expense-input js-expense-description-input"
                  placeholder="Expense description"
                  id="description"
                />
                <label for="amount">Amount:</label>
                <div class="prefix-container">
                  <span class="prefix">Ksh.</span>
                  <input
                    type="text"
                    class="expense-input js-expense-input js-expense-amount-input amount-input"
                    placeholder="0.00"
                    id="amount"
                  />
                </div>
                <label for="category">Category:</label>
                <select
                  id="category"
                  class="expense-input js-expense-category-input"
                >
                  <button>
                    <selectedcontent></selectedcontent>
                  </button>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Bills">Bills</option>
                  <option value="Health">Health</option>
                  <option value="Other">Other</option>
                </select>
                <label for="date">Date:</label>
                <input
                  type="date"
                  class="expense-input js-expense-input js-expense-date-input"
                  id="date"
                />
              </div>
              <button class="add-expense-button js-add-expense-button">
                Add Expense
              </button>
              <div class="added-to-tracker js-added-to-tracker"></div>
              <div class="empty-field-container">
                <div class="empty-field-warning js-empty-field-warning"></div>
              </div>
            </div>

            <div class="recents-container js-recents-container">
              <h4>Recent expenses</h4>
            </div>
          </div>

          <div class="right-panel">
            <div class="total-expenditure">
              <h2>Totals</h2>
              <div class="period-total">
                <p class="period">Today (<span class="today"></span>):</p>
                <p class="cost">Ksh.<span class="todays-total"></span></p>
                <p class="period">
                  This month (<span class="current-month"></span>):
                </p>
                <p class="cost">
                  Ksh.
                  <span class="current-month-total"></span>
                </p>
              </div>
            </div>
            <div class="chart-container js-chart-container">
              <canvas id="doughnutCanvas"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="expense-screen js-expense-screen">
        <div class="edit-alert js-edit-alert"></div>
        <h2 class="entries-title">
          Your Expenses (<span class="expense-quantity js-expense-quantity">
          </span
          >)
        </h2>

        <div class="entries-grid js-entries-grid"></div>

        <div class="confirmation-dialogue js-confirmation-dialogue"></div>
        <div class="edit-dialogue js-edit-dialogue"></div>
        <div class="overlay js-overlay"></div>
        <div class="clear-all-button-container js-clear-all-button-container">
          <button class="clear-all-button js-clear-all-button">
            Clear all
          </button>
        </div>

        <button class="download-button js-download-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
      </section>
    </div>
  </body>
</html>
