<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="./favicons/site.webmanifest" />
  </head>
  <body>
    <div class="header">
      <div class="left-header-section">
        <img src="icons/chart.svg" alt="chart icon" class="chart-icon" />
        <div class="dashboard-text">
          <p class="dashboard-title">Dashboard</p>
          <p class="dashboard-illustration">
            Track, review and stay in control
          </p>
        </div>
      </div>
      <div class="right-header-section">
        <div class="search">
          <img src="icons/search.svg" class="search-icon" />
          <input type="text" name="search" id="search" placeholder="Search" />
        </div>
        <button class="mode home-btn active-mode">Home</button>
        <button class="mode expenses-btn">Expenses</button>
        <button class="change-theme-button js-change-theme-button">
          <img src="icons/theme.svg" />
        </button>
      </div>
    </div>
    <div class="wrapper">
      <section class="home-screen js-home-screen">
        <h1>Track your Expenses Here</h1>
        <div class="month-pill-container">
          <div class="month-pill js-month-pill"></div>
        </div>
        <div class="content-area">
          <div class="left-panel">
            <div class="expense-details">
              <div class="expense-grid">
                <label for="description">Description:</label>
                <input
                  type="text"
                  class="expense-input js-expense-input js-expense-description-input"
                  placeholder="Expense description"
                  id="description"
                />
                <label for="amount">Amount:</label>
                <div class="prefix-container">
                  <span class="prefix">Ksh.</span>
                  <input
                    type="text"
                    class="expense-input js-expense-input js-expense-amount-input amount-input"
                    placeholder="0.00"
                    id="amount"
                  />
                </div>
                <label for="category">Category:</label>
                <select
                  id="category"
                  class="expense-input js-expense-category-input"
                >
                  <button>
                    <selectedcontent></selectedcontent>
                  </button>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Bills">Bills</option>
                  <option value="Health">Health</option>
                  <option value="Other">Other</option>
                </select>
                <label for="date">Date:</label>
                <input
                  type="date"
                  class="expense-input js-expense-input js-expense-date-input"
                  id="date"
                />
              </div>
              <button class="add-expense-button js-add-expense-button">
                Add Expense
              </button>
              <div class="added-to-tracker js-added-to-tracker"></div>
              <div class="empty-field-container">
                <div class="empty-field-warning js-empty-field-warning"></div>
              </div>
            </div>

            <div class="recents-container js-recents-container">
              <h4>Recent expenses</h4>
            </div>
          </div>

          <div class="right-panel">
            <div class="total-expenditure">
              <h2>Totals</h2>
              <div class="period-total">
                <p class="period">
                  Today (<span class="today"></span>):
                </p>
                <p class="cost">
                  Ksh.<span class="todays-total"></span>
                </p>
                <p class="period">
                  This month
                  (<span class="current-month"></span>):
                </p>
                <p class="cost">
                  Ksh.
                  <span class="current-month-total"></span>
                </p>
              </div>
            </div>
            <div class="chart-container js-chart-container">
              <canvas id="doughnutCanvas"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="expense-screen js-expense-screen">
        <div class="edit-alert js-edit-alert"></div>
        <h2 class="entries-title">
          Your Expenses (<span class="expense-quantity js-expense-quantity">
          </span
          >)
        </h2>

        <div class="entries-grid js-entries-grid"></div>

        <div class="confirmation-dialogue js-confirmation-dialogue"></div>
        <div class="edit-dialogue js-edit-dialogue"></div>
        <div class="overlay js-overlay"></div>
        <div class="clear-all-button-container js-clear-all-button-container">
          <button class="clear-all-button js-clear-all-button">
            Clear all
          </button>
        </div>

        <button class="download-button js-download-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
      </section>
    </div>
  </body>
</html>
