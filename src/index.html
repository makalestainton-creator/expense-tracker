<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link rel="stylesheet" href="styles/home-page.css" />
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body>
    <div class="header">
      <div class="left-header-section">
        <img src="icons/chart.svg" alt="chart icon" />
        <div class="dashboard-text">
          <p class="dashboard-title">Expense dashboard</p>
          <p class="dashboard-illustration">
            Track, review and stay in control
          </p>
        </div>
      </div>
      <div class="right-header-section">
        <a href="expenses.html" class="expenses-link">
          <img src="icons/tracking-room.png" class="expenses-icon" />
          <span>Expenses</span>
        </a>
        <button class="change-theme-button js-change-theme-button">
          <img src="icons/theme.svg" alt="" />
        </button>
      </div>
    </div>
    <div class="wrapper">
      <div class="title">
        <h1>Track your Expenses Here</h1>
      </div>
      <!-- <div class="line-separator"></div> -->
      <div class="month-pill-container">
        <div class="month-pill js-month-pill"></div>
      </div>
      <div class="content-area">
        <div class="left-panel">
          <div class="expense-details">
            <div class="expense-grid">
              <label for="description">Description:</label>
              <input
                type="text"
                class="expense-input js-expense-input js-expense-description-input"
                placeholder="Expense description"
                id="description"
              />
              <label for="amount">Amount:</label>
              <!-- styling div here -->
              <div class="prefix-container">
                <span class="prefix">Ksh.</span>
                <input
                  type="text"
                  class="expense-input js-expense-input js-expense-amount-input amount-input"
                  placeholder="0.00"
                  id="amount"
                />
              </div>
              <label for="category">Category:</label>
              <select
                id="category"
                class="expense-input js-expense-category-input"
              >
                <button>
                  <selectedcontent></selectedcontent>
                </button>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
              <label for="date">Date:</label>
              <input
                type="date"
                class="expense-input js-expense-input js-expense-date-input"
                id="date"
              />
            </div>
            <button class="add-expense-button js-add-expense-button">
              Add Expense
            </button>
            <div class="added-to-tracker js-added-to-tracker"></div>
            <div class="empty-field-container">
              <div class="empty-field-warning js-empty-field-warning"></div>
            </div>
          </div>
          <div class="recents-container js-recents-container">
            <h4>Recent expenses</h4>
          </div>
        </div>
        <div class="right-panel">
          <div class="total-expenditure js-total-expenditure"></div>
          <div class="chart-container js-chart-container">
            <canvas id="doughnutCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="scripts/homePage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </body>
</html>
