<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking room</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="styles/expenses.css" />
    <link rel="stylesheet" href="styles/shared.css">
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="home-page-link">
        <img src="tracker/icons/home-page-icon.png" class="home-page-icon" />
        Home
      </a>
      <h2></h2>
      <div class="right-header-section">
        <div class="search">
          <input type="text" id="search-input" placeholder="Search" />
          <button class="search-button">
            <img src="tracker/icons/search.png" class="search-icon" />
          </button>
        </div>
        <button class="change-theme-button js-change-theme-button">
          <img src="icons/theme.svg">
        </button>
      </div>
    </div>
    <div class="edit-alert js-edit-alert"></div>
    <h2 class="entries-title">
      Your Expenses (
      <span>
        <a href="index.html" class="expense-quantity js-expense-quantity"></a>
      </span>
      )
    </h2>
    <div class="entries-grid js-entries-grid"></div>

    <div class="confirmation-dialogue js-confirmation-dialogue"></div>
    <div class="edit-dialogue js-edit-dialogue"></div>
    <div class="dialogue-overlay js-dialogue-overlay"></div>
    <div class="clear-all-button-container js-clear-all-button-container">
      <button class="clear-all-button js-clear-all-button">Clear all</button>
    </div>

    <button class="download-button js-download-button">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </button>

    <script type="module" src="scripts/expenses.js"></script>
  </body>
</html>
